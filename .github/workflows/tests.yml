name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
        exclude:
          - php: '8.3'
            laravel: '13.*'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Configure Testbench
        run: composer require --dev "orchestra/testbench:${{ matrix.laravel == '12.*' && '^10.0' || '^11.0' }}" --no-update --no-interaction
      - name: Resolve dependencies
        run: composer update --prefer-dist --no-interaction
      - name: Run tests
        run: composer test
